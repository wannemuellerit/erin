version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 5
    groups:
      composer-patches:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
      composer-minors:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
      composer-security-patches:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 5
    groups:
      npm-patches:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
      npm-minors:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
      npm-security-patches:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    groups:
      runtime-images:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:45"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
